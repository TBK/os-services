waagent:
  image: ${REGISTRY_DOMAIN}/rancher/os-waagent:v2.7.3.0-1
  command: ["-daemon", "-verbose"]
  privileged: true
  labels:
    io.rancher.os.after: "console"
    io.rancher.os.scope: system
  restart: always
  pid: host
  ipc: host
  net: host
  uts: host
  volumes_from:
  - command-volumes
  - system-volumes
  - user-volumes
  - media-volumes
  volumes:
  - /dev:/dev
  - /sys:/sys
